<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nandu Halwai Birthday ❤️</title>

<style>

body{
margin:0;
font-family:Arial;
text-align:center;
background:linear-gradient(135deg,#ff9a9e,#fad0c4);
color:white;
}

/* NAVBAR */
nav{
padding:15px;
background:rgba(0,0,0,0.2);
display:flex;
justify-content:center;
gap:20px;
}

nav a{
color:white;
text-decoration:none;
font-size:18px;
display:none;
}

/* SECTIONS */
section{
padding:40px 20px;
}

.locked{
filter:blur(6px);
opacity:0.5;
}

/* COUNTDOWN */
#countdown{
font-size:40px;
margin-top:40px;
}

/* GALLERY */
.gallery img{
width:90%;
max-width:250px;
border-radius:20px;
margin:10px;
}

/* CONFETTI */
.confetti{
position:fixed;
width:10px;
height:10px;
top:-10px;
animation:fall linear infinite;
}

@keyframes fall{
to{transform:translateY(100vh);}
}

</style>
</head>

<body>

<nav>
<a id="photosNav" href="#photos">Photos</a>
<a id="momentsNav" href="#moments">Moments</a>
<a id="birthdayNav" href="#birthday">Birthday</a>
</nav>

<section>
<h1>❤️ Nandu Halwai Birthday Countdown ❤️</h1>
<div id="countdown"></div>
</section>

<!-- PHOTOS -->
<section id="photos" class="locked">
<h2>📸 Our Memories</h2>
<p id="photoLock">🔒 Unlocks 3 days before birthday</p>

<div class="gallery">
<img src="photo1.jpg">
<img src="photo2.jpg">
</div>
</section>

<!-- MOMENTS -->
<section id="moments" class="locked">
<h2>💭 Our Journey</h2>
<p id="momentLock">🔒 Unlocks 2 days before birthday</p>

<p>First meet ❤️</p>
<p>First call ☎️</p>
<p>Best memories together 💫</p>
</section>

<!-- BIRTHDAY -->
<section id="birthday" style="display:none">
<h1>🎉 Happy Birthday from Nandu Halwai 🎂</h1>
<p>Aaj ka din sabse special hai ❤️</p>
</section>

<script>

/* CHANGE YEAR IF NEEDED */
let birthday = new Date("May 17, 2026 00:00:00").getTime();

let countdown = setInterval(function(){

let now = new Date().getTime();
let diff = birthday - now;

let days = Math.floor(diff/(1000*60*60*24));
let hours = Math.floor((diff%(1000*60*60*24))/(1000*60*60));
let mins = Math.floor((diff%(1000*60*60))/(1000*60));

document.getElementById("countdown").innerHTML =
days+"d "+hours+"h "+mins+"m";

let daysLeft = Math.ceil(diff/(1000*60*60*24));

/* 3 DAYS LEFT → PHOTOS UNLOCK */
if(daysLeft <= 3){
document.getElementById("photos").classList.remove("locked");
document.getElementById("photoLock").style.display="none";
document.getElementById("photosNav").style.display="block";
}

/* 2 DAYS LEFT → MOMENTS UNLOCK */
if(daysLeft <= 2){
document.getElementById("moments").classList.remove("locked");
document.getElementById("momentLock").style.display="none";
document.getElementById("momentsNav").style.display="block";
}

/* BIRTHDAY DAY */
if(daysLeft <= 0){
clearInterval(countdown);
document.getElementById("countdown").innerHTML="🎉 IT'S TODAY 🎉";

document.getElementById("birthday").style.display="block";
document.getElementById("birthdayNav").style.display="block";

startConfetti();
}

},1000);


/* CONFETTI FUNCTION */
function startConfetti(){
for(let i=0;i<100;i++){
let c=document.createElement("div");
c.classList.add("confetti");
c.style.left=Math.random()*100+"vw";
c.style.animationDuration=(Math.random()*3+2)+"s";
c.style.backgroundColor=
"rgb("+Math.random()*255+","+Math.random()*255+","+Math.random()*255+")";
document.body.appendChild(c);
}
}

</script>

</body>
</html>
