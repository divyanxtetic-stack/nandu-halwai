<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>for her · may 17 surprise</title>

    <!-- PREMIUM FONTS -->
    <!-- PREMIUM FONTS -->
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cinzel:wght@400;700&family=Special+Elite&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --bg-deep: #050505;
            --burgundy: #5e0b0b;
            --burgundy-bright: #8b0000;
            --gold: #c5a021;
            --silver: #c0c0c0;
            --text-light: #e0e0e0;
            --container-bg: rgba(18, 12, 12, 0.95);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Cinzel', serif;
            overflow-x: hidden;
            background: var(--bg-deep);
            color: var(--text-light);
            position: relative;
            padding: 20px;
        }

        /* Sleek Jail Bars */
        .jail-bars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: space-around;
            pointer-events: none;
            z-index: 10;
        }

        .bar {
            width: 10px;
            height: 100%;
            background: linear-gradient(90deg, #111, #333 50%, #111);
            border-left: 1px solid rgba(197, 160, 33, 0.1);
            box-shadow: 5px 0 15px rgba(0, 0, 0, 0.9);
        }

        /* Subtle Cinematic Glow */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, transparent 30%, rgba(94, 11, 11, 0.15) 100%);
            animation: atmosphericGlow 8s infinite alternate;
            pointer-events: none;
            z-index: 1;
        }

        @keyframes atmosphericGlow {
            0% {
                opacity: 0.6;
            }

            100% {
                opacity: 1;
            }
        }

        /* Stylized "Ink" Drips */
        .drip {
            position: fixed;
            top: -20px;
            width: 3px;
            background: var(--burgundy);
            border-radius: 0 0 5px 5px;
            animation: dripFall 7s infinite;
            z-index: 5;
            box-shadow: 0 0 8px var(--burgundy-bright);
        }

        @keyframes dripFall {
            0% {
                transform: translateY(0);
                height: 0;
                opacity: 1;
            }

            40% {
                height: 120px;
                opacity: 1;
            }

            100% {
                transform: translateY(110vh);
                height: 20px;
                opacity: 0;
            }
        }

        /* ===== PREMIUM CONTAINER ===== */

        .container {
            width: 700px;
            max-width: 100%;
            background: var(--container-bg);
            border: 1px solid rgba(197, 160, 33, 0.2);
            /* Subtle Gold Border */
            border-radius: 4px;
            /* More "decent" sharp corners */
            padding: 80px 40px;
            text-align: center;
            box-shadow: 0 0 60px rgba(0, 0, 0, 0.9), 0 0 20px rgba(94, 11, 11, 0.3);
            backdrop-filter: blur(12px);
            animation: cellFadeIn 2.5s ease;
            position: relative;
            z-index: 20;
            margin: auto;
        }

        @keyframes cellFadeIn {
            from {
                opacity: 0;
                transform: scale(0.98);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        h1 {
            font-size: 3.5rem;
            color: var(--burgundy-bright);
            font-family: 'Cinzel Decorative', cursive;
            text-shadow: 0 0 15px rgba(139, 0, 0, 0.5);
            margin-bottom: 5px;
            letter-spacing: 4px;
        }

        .heart-symbol {
            display: inline-block;
            color: var(--gold);
            animation: heartbeat 2s infinite ease-in-out;
        }

        @keyframes heartbeat {

            0%,
            100% {
                transform: scale(1);
                filter: brightness(1);
            }

            50% {
                transform: scale(1.05);
                filter: brightness(1.3) drop-shadow(0 0 5px var(--gold));
            }
        }

        .personal {
            margin-top: 15px;
            font-size: 1.1rem;
            color: var(--silver);
            letter-spacing: 5px;
            font-weight: 400;
            opacity: 0.8;
        }

        /* ===== COUNTDOWN ===== */

        .timer {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin: 50px 0;
            flex-wrap: wrap;
        }

        .time-box {
            padding: 20px 10px;
            width: 110px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(192, 192, 192, 0.1);
            color: var(--gold);
            position: relative;
        }

        .time-box span:first-child {
            display: block;
            font-size: 2.8rem;
            font-family: 'Cinzel', serif;
            font-weight: 700;
        }

        .time-box span:last-child {
            text-transform: uppercase;
            font-size: 0.7rem;
            color: var(--silver);
            letter-spacing: 2px;
            margin-top: 5px;
            display: block;
        }

        /* ===== TYPING MESSAGE ===== */

        .message {
            font-size: 1rem;
            margin-top: 30px;
            min-height: 50px;
            color: var(--text-light);
            font-family: 'Special Elite', cursive;
            opacity: 0.7;
            letter-spacing: 1px;
        }

        /* ===== BUTTONS ===== */

        .btn-group {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 40px;
        }

        button {
            padding: 14px 28px;
            border: 1px solid var(--gold);
            background: transparent;
            color: var(--gold);
            font-family: 'Cinzel', serif;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        button:hover {
            background: var(--gold);
            color: var(--bg-deep);
            box-shadow: 0 0 20px rgba(197, 160, 33, 0.4);
            transform: translateY(-2px);
        }

        /* SURPRISE MODAL */

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 5, 0.98);
            display: none;
            justify-content: center;
            align-items: center;
            color: var(--burgundy-bright);
            font-size: 2rem;
            font-family: 'Cinzel Decorative', cursive;
            text-align: center;
            padding: 40px;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }

        .modal div {
            border: 1px solid var(--gold);
            padding: 60px;
            max-width: 600px;
            box-shadow: 0 0 50px rgba(94, 11, 11, 0.2);
        }

        /* ===== MOBILE ===== */

        @media screen and (max-width: 600px) {
            body {
                padding: 10px;
            }

            .container {
                padding: 50px 20px;
            }

            h1 {
                font-size: 2.2rem;
                letter-spacing: 2px;
            }

            .personal {
                font-size: 0.8rem;
                letter-spacing: 3px;
            }

            .time-box {
                width: 80px;
                padding: 15px 5px;
            }

            .time-box span:first-child {
                font-size: 1.8rem;
            }

            .btn-group {
                gap: 10px;
            }

            button {
                padding: 12px 20px;
                font-size: 0.7rem;
            }

            .modal {
                font-size: 1.2rem;
            }

            .modal div {
                padding: 30px;
            }

            .jail-bars .bar:nth-child(even) {
                display: none;
            }
        }

        /* confetti */
        .confetti {
            position: fixed;
            width: 8px;
            height: 8px;
            top: -10px;
            animation: fall 5s linear infinite;
            z-index: 100;
        }

        @keyframes fall {
            0% {
                transform: translateY(0) rotate(0);
            }

            100% {
                transform: translateY(110vh) rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <!-- JAIL BARS OVERLAY -->
    <div class="jail-bars">
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
    </div>

    <!-- BLOOD DRIPS -->
    <div class="drip" style="left: 10%; animation-delay: 0s;"></div>
    <div class="drip" style="left: 30%; animation-delay: 2s;"></div>
    <div class="drip" style="left: 70%; animation-delay: 1s;"></div>
    <div class="drip" style="left: 90%; animation-delay: 3s;"></div>

    <div class="container">

        <h1>LOVE LOCK <span class="heart-symbol">❤</span></h1>
        <div class="personal">EST. MAY 17 | LOCKDOWN PROTOCOL</div>

        <div class="timer">
            <div class="time-box"><span id="days">00</span><span>days</span></div>
            <div class="time-box"><span id="hours">00</span><span>hours</span></div>
            <div class="time-box"><span id="minutes">00</span><span>minutes</span></div>
            <div class="time-box"><span id="seconds">00</span><span>seconds</span></div>
        </div>

        <div class="message" id="typing"></div>

        <div class="btn-group">
            <button onclick="playMusic()">Play Cinematic Music 🎵</button>
            <button onclick="showSurprise()">Locked Surprise 🔐</button>
        </div>

    </div>

    <!-- SURPRISE MODAL -->
    <div class="modal" id="modal">
        <div>
            ACCESS DENIED!<br><br>
            BHAI KATEGA CAKE...<br>
            BUT ONLY ON MAY 17! 🩸
        </div>
    </div>

    <!-- MUSIC -->
    <audio id="music" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"></audio>

    <script>
        /* ===== COUNTDOWN ===== */
        const targetDate = new Date("May 17, 2026 00:00:00").getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const gap = targetDate - now;

            const d = Math.floor(gap / (1000 * 60 * 60 * 24));
            const h = Math.floor((gap % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((gap % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((gap % (1000 * 60)) / 1000);

            if (gap < 0) {
                document.getElementById("typing").innerText = "THE LOCK IS OPEN! HAPPY BIRTHDAY! ❤️";
                document.querySelector("h1").innerText = "HAPPY BIRTHDAY";
                document.getElementById("modal").innerHTML = "<div>HAPPY BIRTHDAY BSF! ❤️<br><br>THE HEART IS UNLOCKED!</div>";
            }

            document.getElementById("days").innerText = d < 10 ? "0" + d : d;
            document.getElementById("hours").innerText = h < 10 ? "0" + h : h;
            document.getElementById("minutes").innerText = m < 10 ? "0" + m : m;
            document.getElementById("seconds").innerText = s < 10 ? "0" + s : s;
        }

        setInterval(updateCountdown, 1000);

        /* ===== TYPING EFFECT (Funny Quotes) ===== */
        const texts = [
            "Bhai ka bday h, system hang hoga...",
            "Bhai katega cake, baki sab side me...",
            "Love Lock me swagat h, bestie!",
            "17 May ko hi unlock hoga...",
            "Counting down for the chaos...",
            "Bhagwan kare tera cake koi na khaye (jk)..."
        ];

        let textIndex = 0, charIndex = 0;

        function type() {
            if (charIndex < texts[textIndex].length) {
                document.getElementById("typing").innerHTML += texts[textIndex].charAt(charIndex);
                charIndex++;
                setTimeout(type, 60);
            } else {
                setTimeout(() => {
                    document.getElementById("typing").innerHTML = "";
                    charIndex = 0;
                    textIndex = (textIndex + 1) % texts.length;
                    type();
                }, 3000);
            }
        }
        type();

        /* ===== MUSIC ===== */

        function playMusic() {
            document.getElementById("music").play();
        }

        /* ===== SURPRISE ===== */

        function showSurprise() {
            document.getElementById("modal").style.display = "flex";
        }

        /* ===== CONFETTI ===== */

        function startConfetti() {
            for (let i = 0; i < 100; i++) {
                let conf = document.createElement("div");
                conf.className = "confetti";
                conf.style.left = Math.random() * 100 + "%";
                conf.style.background = `hsl(${Math.random() * 360},70%,50%)`;
                conf.style.animationDuration = (3 + Math.random() * 3) + "s";
                document.body.appendChild(conf);
            }
        }

    </script>

</body>

</html>
