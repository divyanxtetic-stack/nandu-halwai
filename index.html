<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Countdown - May 17</title>
    <style>
        body {
            background-color: #fff5f5;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            color: #d63384;
        }
        .container {
            text-align: center;
            padding: 40px;
            border-radius: 20px;
            background: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border: 2px solid #ffc1cf;
        }
        h1 { font-size: 2.5rem; margin-bottom: 10px; }
        .timer {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin: 30px 0;
        }
        .time-box {
            background: #ff4d6d;
            color: white;
            padding: 15px;
            border-radius: 10px;
            min-width: 80px;
        }
        .time-box span { display: block; font-size: 2rem; font-weight: bold; }
        .funny-msg {
            font-style: italic;
            color: #888;
            margin-top: 20px;
            min-height: 50px;
        }
        .heart { color: #ff4d6d; font-size: 1.5rem; }
    </style>
</head>
<body>

<div class="container">
    <h1>Countdown to May 17 <span class="heart">❤</span></h1>
    <p>Professional in the streets, celebrating you in the sheets (of this code).</p>
    
    <div class="timer">
        <div class="time-box"><span id="days">00</span>Days</div>
        <div class="time-box"><span id="hours">00</span>Hrs</div>
        <div class="time-box"><span id="minutes">00</span>Min</div>
        <div class="time-box"><span id="seconds">00</span>Sec</div>
    </div>

    <div class="funny-msg" id="joke">Loading daily roast...</div>
</div>

<script>
    // Set the target date: May 17 of the current or next year
    const targetDate = new Date("May 17, 2026 00:00:00").getTime();

    const jokes = [
        "One step closer to becoming a vintage classic!",
        "Countdown to the day you legally have to be spoiled.",
        "Warning: Levels of 'Birthday Diva' are rising.",
        "I love you more than I love hitting 'Snooze'!"
    ];

    function updateCountdown() {
        const now = new Date().getTime();
        const gap = targetDate - now;

        const d = Math.floor(gap / (1000 * 60 * 60 * 24));
        const h = Math.floor((gap % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const m = Math.floor((gap % (1000 * 60 * 60)) / (1000 * 60));
        const s = Math.floor((gap % (1000 * 60)) / 1000);

        document.getElementById("days").innerText = d;
        document.getElementById("hours").innerText = h;
        document.getElementById("minutes").innerText = m;
        document.getElementById("seconds").innerText = s;

        // Change funny message every 5 seconds
        if (s % 5 === 0) {
            document.getElementById("joke").innerText = jokes[Math.floor(Math.random() * jokes.length)];
        }
    }

    setInterval(updateCountdown, 1000);
</script>

</body>
</html>
