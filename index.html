<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nandu Halwai Birthday</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

/* Background animation */
body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(-45deg,#ff9a9e,#fad0c4,#fbc2eb,#a18cd1);
background-size:400% 400%;
animation:gradient 12s ease infinite;
color:white;
}

@keyframes gradient{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

/* Card container */
.container{
text-align:center;
padding:40px;
border-radius:25px;
background:rgba(255,255,255,0.15);
backdrop-filter:blur(15px);
box-shadow:0 20px 50px rgba(0,0,0,0.3);
width:90%;
max-width:600px;
}

/* Title */
h1{
font-size:32px;
font-weight:700;
margin-bottom:10px;
}

/* subtitle */
.subtitle{
opacity:0.9;
margin-bottom:30px;
}

/* countdown boxes */
.countdown{
display:flex;
justify-content:center;
gap:15px;
flex-wrap:wrap;
}

.time-box{
background:rgba(255,255,255,0.2);
padding:20px;
border-radius:15px;
min-width:90px;
}

.time{
font-size:28px;
font-weight:700;
}

.label{
font-size:14px;
opacity:0.8;
}

/* birthday message */
#birthdayMsg{
margin-top:30px;
font-size:24px;
display:none;
animation:fadeIn 2s ease;
}

@keyframes fadeIn{
from{opacity:0;}
to{opacity:1;}
}

</style>
</head>

<body>

<div class="container">

<h1>🎂 Nandu Halwai Birthday Countdown</h1>
<p class="subtitle">Something special is coming ❤️</p>

<div class="countdown">
<div class="time-box">
<div id="days" class="time">0</div>
<div class="label">Days</div>
</div>

<div class="time-box">
<div id="hours" class="time">0</div>
<div class="label">Hours</div>
</div>

<div class="time-box">
<div id="minutes" class="time">0</div>
<div class="label">Minutes</div>
</div>

<div class="time-box">
<div id="seconds" class="time">0</div>
<div class="label">Seconds</div>
</div>
</div>

<div id="birthdayMsg">
🎉 Happy Birthday! You are truly special ❤️
</div>

</div>

<script>

// CHANGE DATE HERE
let birthday = new Date("May 17, 2026 00:00:00").getTime();

let timer = setInterval(function(){

let now = new Date().getTime();
let diff = birthday - now;

let days = Math.floor(diff/(1000*60*60*24));
let hours = Math.floor((diff%(1000*60*60*24))/(1000*60*60));
let minutes = Math.floor((diff%(1000*60*60))/(1000*60));
let seconds = Math.floor((diff%(1000*60))/1000);

document.getElementById("days").innerText = days;
document.getElementById("hours").innerText = hours;
document.getElementById("minutes").innerText = minutes;
document.getElementById("seconds").innerText = seconds;

if(diff <= 0){
clearInterval(timer);
document.querySelector(".countdown").style.display="none";
document.getElementById("birthdayMsg").style.display="block";
}

},1000);

</script>

</body>
</html>
